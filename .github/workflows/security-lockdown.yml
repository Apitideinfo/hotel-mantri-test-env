name: Security & RLS Lockdown Audit

on:
  push:
    branches: [main, security/remediation]
  pull_request:
    branches: [main]

jobs:
  rls-lockdown-check:
    name: Verify RLS Lockdown & Zero Anon Access
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static & Live RLS Lockdown Audit
        run: node scripts/test_rls_lockdown.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Check
        run: npm run build

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Tenant Scope Static Analysis
        run: node scripts/lint_tenant_scope.mjs

      - name: Staff Role Escalation Prevention Audit
        run: node scripts/test_role_escalation.mjs

      - name: Hardcoded Secrets & Fail-Closed Audit
        run: node scripts/test_hardcoded_secrets.mjs

      - name: Payment Settlement Hardening Audit
        run: node scripts/test_verify_payment_hardening.mjs

      - name: Adversarial Hostile-User Security Attack Suite
        run: node scripts/security_attack_suite.mjs
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          GUEST_CHECKOUT_SECRET: ${{ secrets.GUEST_CHECKOUT_SECRET }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
