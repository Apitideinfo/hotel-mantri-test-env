name: Security & RLS Lockdown Audit

on:
  push:
    branches: [main, security/remediation]
  pull_request:
    branches: [main]

jobs:
  rls-lockdown-check:
    name: Verify RLS Lockdown & Zero Anon Access
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static & Live RLS Lockdown Audit
        run: node scripts/test_rls_lockdown.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: TypeScript Check
        run: npm run typecheck

      - name: Build Check
        run: npm run build

      - name: Dependency Vulnerability Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Tenant Scope Static Analysis
        run: node scripts/lint_tenant_scope.mjs
